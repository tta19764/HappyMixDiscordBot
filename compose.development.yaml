services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      ASPNETCORE_URLS: http://+:8080
      DOTNET_ENVIRONMENT: Development
      Storage__DatabasePath: /app/data/happymix.db
    volumes:
      - happymix-data:/app/data
      - type: bind
        source: ./src/HappyMix.Bot/appsettings.Development.json
        target: /app/appsettings.Development.json
        read_only: true
        bind:
          create_host_path: false

volumes:
  happymix-data:
